<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="Floating astronaut illustration">
  <defs>
    <radialGradient id="visor" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.45" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#0B1026"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .float { animation: float 6s ease-in-out infinite; }
      .star { animation: twinkle 5s ease-in-out infinite; }
      .star.alt { animation-duration: 3.4s; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <circle cx="120" cy="160" r="112" fill="url(#aura)"/>

  <ellipse cx="120" cy="176" rx="106" ry="48" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-dasharray="3 9" transform="rotate(-16 120 176)"/>

  <g class="star" fill="#E9E6FF">
    <circle cx="30" cy="66" r="2"/>
    <circle cx="206" cy="46" r="2.4"/>
    <circle cx="62" cy="226" r="1.7"/>
    <circle cx="188" cy="244" r="2"/>
    <circle cx="16" cy="150" r="1.6"/>
  </g>
  <g class="star alt" fill="#7DD3FC">
    <circle cx="198" cy="140" r="1.8"/>
    <circle cx="44" cy="112" r="1.7"/>
  </g>

  <circle cx="212" cy="84" r="10" fill="#7C3AED" opacity="0.7"/>
  <circle cx="212" cy="84" r="10" fill="none" stroke="#C4B5FD" stroke-opacity="0.5"/>

  <path d="M64 150 C34 168 30 210 14 224" fill="none" stroke="#7DD3FC" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>

  <g class="float">
    <rect x="72" y="132" width="96" height="88" rx="28" fill="#312E81"/>
    <rect x="60" y="142" width="21" height="62" rx="10.5" fill="#C7D2FE" transform="rotate(-12 70.5 173)"/>
    <rect x="159" y="142" width="21" height="62" rx="10.5" fill="#C7D2FE" transform="rotate(12 169.5 173)"/>
    <rect x="90" y="198" width="23" height="48" rx="11.5" fill="url(#suit)"/>
    <rect x="127" y="198" width="23" height="48" rx="11.5" fill="url(#suit)"/>
    <rect x="88" y="236" width="27" height="13" rx="6.5" fill="#7C3AED"/>
    <rect x="125" y="236" width="27" height="13" rx="6.5" fill="#7C3AED"/>
    <rect x="82" y="136" width="76" height="82" rx="26" fill="url(#suit)"/>
    <rect x="104" y="160" width="32" height="24" rx="8" fill="#4C1D95"/>
    <circle cx="112" cy="172" r="3.2" fill="#7DD3FC"/>
    <circle cx="122" cy="172" r="3.2" fill="#A78BFA"/>
    <circle cx="132" cy="172" r="3.2" fill="#E9E6FF" opacity="0.8"/>
    <circle cx="120" cy="94" r="47" fill="url(#suit)"/>
    <circle cx="120" cy="94" r="35" fill="url(#visor)"/>
    <ellipse cx="107" cy="81" rx="10" ry="14" fill="#7DD3FC" opacity="0.65" transform="rotate(-24 107 81)"/>
    <circle cx="136" cy="108" r="3.4" fill="#E9E6FF" opacity="0.85"/>
    <path d="M101 62 C108 52 130 50 140 60" fill="none" stroke="#C4B5FD" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
